<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><meta name="description" content="Check the status and delivery tracking for your Pexoluma Studio physical order."><title>Track Your Order | Pexoluma Studio</title>
<style>
:root{--bg:#090d18;--panel:#111827;--ink:#f4f6f8;--muted:#aab5c5;--line:#293548;--lime:#c8fb7b;--red:#ffb7b7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1b2940 0,transparent 42%),var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.nav{padding:24px 0}.brand{font-weight:900;color:var(--ink);text-decoration:none;font-size:1.2rem}.brand span{color:var(--lime)}main{padding:5vh 0 12vh}.panel,.order{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,38px)}.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:850}h1{font-size:clamp(2.3rem,7vw,4rem);letter-spacing:-.06em;line-height:1.02;margin:10px 0 12px}.muted{color:var(--muted)}label{display:block;font-weight:750;margin:16px 0 6px;font-size:.9rem}input{width:100%;padding:14px;border:1px solid #40506a;background:#0b1220;color:var(--ink);border-radius:11px;font:inherit}button,.track{display:inline-block;border:0;background:var(--lime);color:#10170e;font-weight:900;border-radius:11px;padding:13px 18px;text-decoration:none;cursor:pointer;font:inherit}button{width:100%;margin-top:18px}.error{color:var(--red)}.results{display:grid;gap:14px;margin-top:20px}.order h2{margin:0 0 8px;font-size:1.2rem}.order-id{color:var(--lime);font-weight:800}.status{display:inline-block;border:1px solid #40506a;border-radius:30px;padding:4px 10px;font-size:.82rem;margin:10px 0}.track{margin-top:12px}.small{font-size:.85rem;color:var(--muted)}
</style></head><body><div class="wrap nav"><a class="brand" href="index.html">Pexo<span>luma</span> Studio</a></div><main class="wrap"><section class="panel"><div class="eyebrow">Order support</div><h1>Track your order.</h1><p class="muted">Enter the full name and email address used at checkout. We'll show matching physical orders and their latest delivery updates.</p><form id="lookup"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" maxlength="120" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required><button id="submit">Find my order</button></form><p id="message" class="small" aria-live="polite"></p><div id="results" class="results"></div></section></main>
<script>
(function(){const API="https://gquuoabsmfjroswckzka.supabase.co/functions/v1/order-tracking";const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));$("lookup").addEventListener("submit",async e=>{e.preventDefault();$("message").textContent="Checking your details…";$("message").className="small";$("results").innerHTML="";$("submit").disabled=true;try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("name").value,email:$("email").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Unable to check your order.");if(!d.orders?.length){$("message").textContent="No matching physical orders found. Check that your name and email match your checkout details.";return}$("message").textContent=d.orders.length+" matching order"+(d.orders.length===1?"":"s")+" found."; $("results").innerHTML=d.orders.map(o=>{const url=String(o.tracking_url||"");const safe=/^https?:\/\//i.test(url)?url:"";return '<article class="order"><div class="order-id">'+esc(o.order_id)+'</div><h2>'+esc(o.product_name)+'</h2><div class="small">Quantity: '+esc(o.quantity)+' · Ordered: '+esc(new Date(o.created_at).toLocaleDateString("en-GB"))+'</div><div class="status">Status: '+esc(String(o.order_status||"processing").replaceAll("_"," "))+'</div>'+(o.tracking_carrier?'<p class="small">Courier: '+esc(o.tracking_carrier)+'</p>':'')+(o.tracking_number?'<p class="small">Tracking number: '+esc(o.tracking_number)+'</p>':'')+(safe?'<a class="track" href="'+esc(safe)+'" target="_blank" rel="noopener noreferrer">Track my parcel ↗</a>':'<p class="small">Your courier tracking link will appear here once your parcel has been dispatched and tracking has been added.</p>')+'</article>'}).join("")}catch(err){$("message").textContent=err.message;$("message").className="small error"}finally{$("submit").disabled=false;$("submit").textContent="Find my order"}})})();
</script></body></html>
